name: Q-Audio Desktop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: 3.24.0

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  build-windows-msix:
    needs: test-lint
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows MSIX
        shell: pwsh
        run: ./ci/windows_msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-MSIX
          path: build/windows/msix/*.msix

  build-macos-dmg:
    needs: test-lint
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: chmod +x ci/macos_dmg.sh
      - run: ./ci/macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: build/macos/dmg/*.dmg