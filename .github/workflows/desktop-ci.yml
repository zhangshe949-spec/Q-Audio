name: Q-Audio Desktop CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

  build-windows-msix:
    needs: test-lint
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows MSIX
        shell: pwsh
        run: ./ci/windows_msix.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: Windows-MSIX
          path: build/windows/msix/*.msix
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/msix/*.msix
          generate_release_notes: true

  build-macos-dmg:
    needs: test-lint
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: chmod +x ci/macos_dmg.sh
      - run: ./ci/macos_dmg.sh
      - uses: actions/upload-artifact@v5
        with:
          name: macOS-DMG
          path: build/macos/dmg/*.dmg
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/dmg/*.dmg
          generate_release_notes: true