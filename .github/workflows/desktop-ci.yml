name: Q-Audio Desktop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: 3.24.0

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  build-windows-msix:
    needs: test-lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows MSIX
        shell: pwsh
        run: ./ci/windows_msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-MSIX
          path: build/windows/msix/*.msix

  build-macos-dmg:
    needs: test-lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: chmod +x ci/macos_dmg.sh
      - run: ./ci/macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: build/macos/dmg/*.dmg

  build-linux-appimage:
    needs: test-lint
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libssl-dev \
            libappindicator3-dev \
            patchelf \
            fuse \
            appstream

      - name: Install AppImage tools
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Build Flutter Linux
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          # desktop entry
          cat > AppDir/usr/share/applications/q-audio.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Q-Audio
          Exec=q-audio
          Icon=q-audio
          EOF

          # icon
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/q-audio.png

      - name: Create AppImage
        run: |
          linuxdeploy --appdir AppDir --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q-Audio-AppImage
          path: "*.AppImage"