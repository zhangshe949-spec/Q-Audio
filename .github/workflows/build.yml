name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  windows:
    name: Windows MSIX
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y

          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            $wixBin = Get-ChildItem `
              "${env:ProgramFiles(x86)}", "${env:ProgramFiles}" `
              -Directory `
              -Filter "WiX Toolset*" `
              -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
              Select-Object -First 1
          }

          if (-not $wixBin) {
            throw "WiX Toolset not found"
          }

          # 关键：写入 GITHUB_PATH，后续步骤才可用
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & (Join-Path $wixBin "candle.exe") -?
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Windows Release
        run: flutter build windows --release --no-pub

      - name: Create MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-Command candle.exe | Out-String | Write-Host
          dart run msix:create --verbose

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-audio-windows-msix
          path: build/msix/*.msix
          retention-days: 30

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/msix/*.msix
          generate_release_notes: true

  macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install create-dmg
        run: |
          brew install create-dmg
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          which create-dmg

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build macOS Release
        run: flutter build macos --release --no-pub

      - name: Create DMG
        run: |
          APP_NAME="Q-Audio"
          APP_PATH="build/macos/Build/Products/Release/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            find build -name "*.app" -type d
            exit 1
          fi
          DMG_NAME="${APP_NAME}-${{ github.ref_name }}.dmg"
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 200 190 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "$APP_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-audio-macos-dmg
          path: "*.dmg"
          retention-days: 30

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "*.dmg"
          generate_release_notes: true

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++6 \
            libglib2.0-dev libblkid-dev libgudev-1.0-dev \
            fuse libfuse2 patchelf desktop-file-utils \
            appstream-util file

      - name: Install linuxdeploy & appimagetool
        run: |
          set -e
          cd /tmp
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage"
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x *.AppImage
          sudo mv *.AppImage /usr/local/bin/
          linuxdeploy --version
          appimagetool --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Linux Release
        run: flutter build linux --release --no-pub

      - name: Create AppImage
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-audio-linux-appimage
          path: "*.AppImage"
          retention-days: 30

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: "*.AppImage"
          generate_release_notes: true