name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  windows:
    name: Windows MSIX
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install WiX Toolset
        run: |
          choco install -y wixtoolset
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path $wixPath) {
            $env:PATH += ";$wixPath"
            echo "Added WiX to PATH"
          } else {
            Write-Warning "WiX path not found at $wixPath"
            Get-ChildItem "C:\Program Files*" -Filter "WiX*" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          }
          # Verify candle.exe
          candle -? 2>&1 | head -5

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Run tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build Windows Release
        working-directory: app
        run: flutter build windows --release --no-pub

      - name: Create MSIX
        working-directory: app
        run: flutter pub run msix:create --verbose

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-audio-windows-msix
          path: app/build/msix/*.msix
          retention-days: 30

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/msix/*.msix
          generate_release_notes: true

  macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install create-dmg
        run: |
          brew install create-dmg
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          which create-dmg

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Run tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build macOS Release
        working-directory: app
        run: flutter build macos --release --no-pub

      - name: Create DMG
        working-directory: app
        run: |
          APP_NAME="Q-Audio"
          APP_PATH="build/macos/Build/Products/Release/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            find build -name "*.app" -type d
            exit 1
          fi
          DMG_NAME="${APP_NAME}-${{ github.ref_name }}.dmg"
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 200 190 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "$APP_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-audio-macos-dmg
          path: app/*.dmg
          retention-days: 30

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/*.dmg
          generate_release_notes: true

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++6 \
            libglib2.0-dev libblkid-dev libgudev-1.0-dev \
            fuse libfuse2 patchelf desktop-file-utils \
            appstream-util file

      - name: Install linuxdeploy & appimagetool
        run: |
          set -e
          cd /tmp
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage"
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x *.AppImage
          sudo mv *.AppImage /usr/local/bin/
          linuxdeploy --version
          appimagetool --version

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Run tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build Linux Release
        working-directory: app
        run: flutter build linux --release --no-pub

      - name: Create AppImage
        working-directory: app
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-audio-linux-appimage
          path: app/*.AppImage
          retention-days: 30

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/*.AppImage
          generate_release_notes: true