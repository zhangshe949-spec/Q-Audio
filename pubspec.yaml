name: q_audio
description: Q-Audio — 音乐聚合播放器
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.1
  http: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.3.5
  media_kit: ^1.1.10
  file_picker: ^8.0.0
  win32audio: ^1.2.0
  # Desktop-specific dependencies
  window_manager: ^0.4.2
  system_tray: ^2.0.3
  flutter_media_session: ^3.0.5
  bitsdojo_window: ^0.1.5
  hotkey_manager: ^0.2.3
  win32: ^5.7.0
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.4
  msix: ^3.12.1
  image: ^4.10.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico

msix_config:
  display_name: Q-Audio
  publisher_display_name: QAudio
  identity_name: QAudio.QAudio
  publisher: CN=QAudio
  msix_version: 0.1.0.0
  logo_path: windows/runner/resources/app_icon.ico
  architecture: x64
  capabilities: "internetClient,musicLibrary,runFullTrust"
  protocol_activation: qaudio
  file_extension: ".mp3"
  output_path: build/msix
  output_name: Q-Audio
  sign_msix: false
  install_certificate: false
  build_windows: false
  trim_logo: true
  languages: "zh-CN,en-US"